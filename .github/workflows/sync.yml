name: durazno-feed

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "sync.mjs"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: durazno-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar noticias de durazno.uy
        run: node sync.mjs
      - name: Publicar cambios
        run: |
          git config user.name "durazno-feed"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar"
          else
            git commit -m "Actualiza noticias de durazno.uy"
            git push
          fi